
<!DOCTYPE html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="고도화된 AI 기술력과 풍부한 실무 경험으로 고객의 성장 동력을 확보하고 차별화된 지식재산 솔루션을 선사합니다." />
    <meta name="theme-color" content="#e8e6e3" />
    <title>COSS KNP GROUP</title>
    <!-- 본문 글꼴: Pretendard (SIL Open Font License 1.1, https://github.com/orioncactus/pretendard) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Nanum+Gothic+Coding:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // 저장된 테마를 첫 화면 전에 적용합니다(키는 src/hooks/useTheme.ts의 THEME_STORAGE_KEY와 같음).
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirectPath = params.get('p');
        if (!redirectPath) {
          return;
        }

        params.delete('p');
        window.history.replaceState(null, '', redirectPath);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
